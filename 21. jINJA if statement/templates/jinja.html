<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>jINJA if statement</title>
    <link href="css/style.css" rel="stylesheet">
  </head>
  <body>
  <h1>Jinja if statement</h1>
  <!-- jika kondisi dibawah ini dari variabel main.py tidak sesuai maka tidak akan muncul-->
    {%if a == 10 and b == 5 %}
    <p>{{a}} dan {{b}}</p>
    {%endif%}
  </body>
</html>
